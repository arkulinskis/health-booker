<div class="ds-studio-host">
  <div class="ds-studio" anvil:name="card">
    <div class="ds-cover">
      <span class="ft"><span class="ui-badge clay" anvil:name="featured">Featured</span></span>
      <anvil-component type="Button" name="fav_button" prop:role='["btn", "btn-icon", "btn-sm", "fav", "ic-heart"]' prop:text="Follow"></anvil-component>
    </div>
    <div class="in">
      <h3><a anvil:dom-node="name_link" href="#discover/studios"></a></h3>
      <div class="hb-meta"><i class="ic ic-pin"></i><span anvil:dom-node="hood"></span> · <span anvil:dom-node="stars"></span><span anvil:dom-node="rating"></span></div>
      <p class="muted small" anvil:dom-node="tagline"></p>
      <div class="hb-tags" anvil:dom-node="tags"></div>
      <div class="intro" anvil:name="intro"><span anvil:dom-node="intro_name"></span><b anvil:dom-node="intro_price"></b></div>
    </div>
  </div>
</div>
