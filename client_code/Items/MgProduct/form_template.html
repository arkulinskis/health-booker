<div class="mg-prod-host">
  <div class="ui-card mg-prod" anvil:name="card">
    <div class="ui-row between"><span class="ui-badge" anvil:dom-node="kind"></span><span class="ui-badge" anvil:name="hidden">Hidden</span></div>
    <b anvil:dom-node="name"></b><span class="p" anvil:dom-node="price"></span>
    <span class="small muted" anvil:dom-node="what"></span><span class="small" anvil:dom-node="sold"></span>
    <anvil-component type="Button" name="edit_button" prop:text="Edit" prop:role='["btn", "btn-sm", "ic-edit"]'></anvil-component>
  </div>
</div>
