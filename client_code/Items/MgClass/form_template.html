<div class="mg-cls-host">
  <div class="mg-cls" anvil:name="row">
    <div class="hb-time"><b><span anvil:dom-node="t_clock"></span><small anvil:dom-node="t_ampm"></small></b><span anvil:dom-node="t_sub"></span></div>
    <div class="mg-cls-mid"><b anvil:dom-node="title"></b> <span class="ui-badge good" anvil:name="live">On now</span> <span class="ui-badge bad" anvil:name="cancelled">Cancelled</span>
      <div class="hb-meta" anvil:dom-node="meta"></div></div>
    <div class="mg-fill"><small anvil:dom-node="fill_top"></small><div class="hb-bar" anvil:name="bar"><i anvil:dom-node="bar_fill"></i></div><small anvil:dom-node="fill_bottom"></small></div>
    <div class="acts ui-row">
      <anvil-component type="Button" name="roster_button" prop:text="Class list" prop:role='["btn", "btn-sm", "btn-primary", "ic-users"]'></anvil-component>
      <anvil-component type="Button" name="restore_button" prop:text="Restore" prop:role='["btn", "btn-sm"]'></anvil-component>
    </div>
  </div>
</div>
