<div class="tc-host">
  <div class="hb-class tc-class" anvil:name="card">
    <div class="hb-time"><b><span anvil:dom-node="t_clock"></span><small anvil:dom-node="t_ampm"></small></b><span anvil:dom-node="t_sub"></span></div>
    <div class="hb-mid"><h3><a anvil:dom-node="title_link" href="#teach"></a></h3>
      <div class="hb-meta"><span class="hb-dot"></span><span anvil:dom-node="meta"></span></div>
      <div class="hb-tags" anvil:dom-node="tags"></div></div>
    <div class="tc-acts">
      <anvil-component type="Button" name="roster_button" prop:text="Class list" prop:role='["btn", "btn-sm", "btn-primary", "ic-users"]'></anvil-component>
      <anvil-component type="Button" name="ask_button" prop:text="Ask for a sub" prop:role='["btn", "btn-sm", "ic-swap"]'></anvil-component>
      <anvil-component type="Button" name="withdraw_button" prop:text="Withdraw request" prop:role='["btn", "btn-sm", "btn-ghost"]'></anvil-component>

  </div>
