<div class="pr-entry-host">
  <div class="pr-entry" anvil:name="row">
    <div class="d"><small anvil:dom-node="month"></small><b anvil:dom-node="day"></b></div>
    <div class="pr-entry-mid"><b anvil:dom-node="title"></b>
      <div class="hb-meta"><span class="hb-dot"></span><span anvil:dom-node="meta"></span></div>
      <div class="note" anvil:dom-node="note"></div></div>
    <button type="button" class="face" anvil:name="face_btn" anvil:on-dom:click="self.face_click"><span anvil:dom-node="face"></span><span anvil:dom-node="face_word"></span></button>
  </div>
</div>
