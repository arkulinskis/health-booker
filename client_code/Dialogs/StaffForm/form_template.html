<div class="ui hb-dialog">
  <h2 class="dlg-h" anvil:dom-node="title"></h2>
  <div class="mg-form">
    <label class="ui-field"><span>Name</span><anvil-component type="TextBox" name="name_box"></anvil-component></label>
    <label class="ui-field" anvil:name="email_field"><span>Email they sign in with</span><anvil-component type="TextBox" name="email_box" prop:type="email"></anvil-component></label>
    <label class="ui-field"><span>Role</span><anvil-component type="DropDown" name="role_box"></anvil-component></label>
    <div class="mg-check"><anvil-component type="CheckBox" name="teaches_box" prop:text="Teaches classes"></anvil-component></div>
    <div class="ui-field full"><span>Styles</span>
      <anvil-component type="RepeatingPanel" name="styles_panel" prop:item_template="Health_Booker.Items.Chip" prop:role='["hb-chips"]'></anvil-component></div>
    <label class="ui-field full"><span>Bio <em>(on the studio page)</em></span><anvil-component type="TextArea" name="bio_box" prop:height="80"></anvil-component></label>
    <label class="ui-field"><span>Pay per class ($)</span><anvil-component type="TextBox" name="base_box" prop:type="number"></anvil-component></label>
    <label class="ui-field"><span>Plus per student ($)</span><anvil-component type="TextBox" name="head_box" prop:type="number"></anvil-component></label>
    <label class="ui-field"><span>...after this many students</span><anvil-component type="TextBox" name="after_box" prop:type="number"></anvil-component></label>
    <anvil-component type="Label" name="example" prop:role='["fine-print", "mg-payex"]'></anvil-component>
    <anvil-component type="Label" name="message" prop:role='["msg-error", "full"]' prop:visible="false"></anvil-component>
  </div>
  <div class="ui-row end">
    <anvil-component type="Button" name="close_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
    <anvil-component type="Button" name="save_button" prop:role='["btn", "btn-primary"]'></anvil-component>
  </div>
</div>
