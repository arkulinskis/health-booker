<div class="ui hb-dialog">
  <h2 class="dlg-h" anvil:dom-node="title"></h2>
  <div class="mg-form">
    <label class="ui-field full"><span>Name</span><anvil-component type="TextBox" name="title_box" prop:placeholder="e.g. Sunset Flow"></anvil-component></label>
    <label class="ui-field"><span>Style</span><anvil-component type="DropDown" name="style_box"></anvil-component></label>
    <label class="ui-field"><span>Level</span><anvil-component type="DropDown" name="level_box"></anvil-component></label>
    <label class="ui-field"><span>Teacher</span><anvil-component type="DropDown" name="teacher_box"></anvil-component></label>
    <label class="ui-field"><span>Room</span><anvil-component type="DropDown" name="room_box"></anvil-component></label>
    <label class="ui-field"><span>Date</span><anvil-component type="TextBox" name="date_box" prop:type="date"></anvil-component></label>
    <label class="ui-field"><span>Time</span><anvil-component type="TextBox" name="time_box"></anvil-component></label>
    <label class="ui-field"><span>Minutes</span><anvil-component type="TextBox" name="minutes_box" prop:type="number"></anvil-component></label>
    <label class="ui-field"><span>Mats available</span><anvil-component type="TextBox" name="capacity_box" prop:type="number"></anvil-component></label>
    <label class="ui-field"><span>Kind</span><anvil-component type="DropDown" name="kind_box"></anvil-component></label>
    <label class="ui-field"><span>Workshop price ($)</span><anvil-component type="TextBox" name="price_box" prop:type="number"></anvil-component></label>
    <label class="ui-field"><span>Intensity</span><anvil-component type="DropDown" name="intensity_box"></anvil-component></label>
    <div class="mg-check"><anvil-component type="CheckBox" name="heated_box" prop:text="Heated room"></anvil-component></div>
    <div class="ui-field full"><span>Tags</span>
      <anvil-component type="RepeatingPanel" name="tags_panel" prop:item_template="Health_Booker.Items.Chip" prop:role='["hb-chips"]'></anvil-component></div>
    <label class="ui-field full"><span>Description</span><anvil-component type="TextArea" name="about_box" prop:height="80"></anvil-component></label>
    <label class="ui-field full" anvil:name="repeat_field"><span>Repeat every week for</span><anvil-component type="DropDown" name="repeat_box"></anvil-component></label>
    <label class="ui-field full" anvil:name="scope_field"><span>Apply changes to</span><anvil-component type="DropDown" name="scope_box"></anvil-component></label>
    <anvil-component type="Label" name="message" prop:role='["msg-error", "full"]' prop:visible="false"></anvil-component>
  </div>
  <div class="ui-row mg-form-acts">
    <anvil-component type="Button" name="cancel_class_button" prop:text="Cancel class" prop:role='["btn", "btn-danger", "ic-x"]'></anvil-component>
    <anvil-component type="Button" name="roster_button" prop:text="Class list" prop:role='["btn", "ic-users"]'></anvil-component>
    <span class="ui-spacer"></span>
    <anvil-component type="Button" name="close_button" prop:text="Close" prop:role='["btn", "btn-ghost"]'></anvil-component>
    <anvil-component type="Button" name="save_button" prop:role='["btn", "btn-primary", "ic-check"]'></anvil-component>
  </div>
</div>
