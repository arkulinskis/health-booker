<div class="ui hb-dialog">
  <h2 class="dlg-h" anvil:dom-node="title"></h2>
  <div class="mg-form">
    <label class="ui-field full"><span>Name</span><anvil-component type="TextBox" name="name_box"></anvil-component></label>
    <label class="ui-field"><span>Kind</span><anvil-component type="DropDown" name="kind_box"></anvil-component></label>
    <label class="ui-field"><span>Classes <em>(empty = unlimited)</em></span><anvil-component type="TextBox" name="credits_box" prop:type="number"></anvil-component></label>
    <label class="ui-field"><span>Valid for (days)</span><anvil-component type="TextBox" name="days_box" prop:type="number"></anvil-component></label>
    <label class="ui-field"><span>Price ($)</span><anvil-component type="TextBox" name="price_box" prop:type="number"></anvil-component></label>
    <label class="ui-field full"><span>One line for students</span><anvil-component type="TextBox" name="about_box"></anvil-component></label>
    <div class="full"><anvil-component type="CheckBox" name="intro_box" prop:text="First visit only (intro offer)"></anvil-component></div>
    <div class="full"><anvil-component type="CheckBox" name="active_box" prop:text="On sale"></anvil-component></div>
    <anvil-component type="Label" name="message" prop:role='["msg-error", "full"]' prop:visible="false"></anvil-component>
  </div>
  <div class="ui-row end">
    <anvil-component type="Button" name="close_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
    <anvil-component type="Button" name="save_button" prop:text="Save" prop:role='["btn", "btn-primary"]'></anvil-component>
  </div>
</div>
